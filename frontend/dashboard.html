<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Discord Bot Configurator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🎮 Discord Bot Configurator</span>
            <div class="d-flex align-items-center">
                <div id="userAvatar" class="me-2"></div>
                <span id="userName" class="text-white me-3"></span>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>📡 Your Servers</h2>
                <p class="text-muted">Select a server to install and configure your bot</p>
                <div id="serversList" class="row mt-3"></div>
            </div>
        </div>
    </div>
    
    <!-- Config Modal -->
    <div class="modal fade" id="configModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">⚙️ Bot Configuration</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="configForm" enctype="multipart/form-data">
                        <div id="configFields"></div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary w-100">
                                💾 Generate Configuration
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
